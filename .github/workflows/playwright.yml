name: Playwright tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGE_URL: ${{ vars.PAGE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check PAGE_URL configuration
        run: |
          if [ -z "$PAGE_URL" ]; then
            echo "Set the PAGE_URL repository variable to the e-commerce app URL."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Upload Playwright reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            playwright-report/
            test-results/
            report/
            failureAt*.png
            OrderPlaced.png
          if-no-files-found: ignore
          retention-days: 14
